name: Validate registry

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install --require-hashes -r tooling/private-font-proof/requirements.lock.txt
      - run: npm test
      - name: Run private browser-QA preflight integration
        shell: bash
        run: |
          browser_executable="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser_executable"
          BROWSER_QA_EXECUTABLE="$browser_executable" node --test tests/browser-preflight.test.mjs
